<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Ray</title>
  <meta name="description" content="Blog de Ray." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="canonical" href="https://www.rblez.com/blog/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#fff;color:#111214;font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .container{max-width:42rem;margin:0 auto;padding:3rem 2rem}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3.5rem}
    .isotipo{width:26px;height:26px;display:block}
    .isotipo g{fill:#111214}
    .brand{display:flex;align-items:center;gap:.6rem}
    nav{display:flex;gap:1.75rem}
    nav a{font-family:"Geist Mono",ui-monospace,monospace;font-size:.7rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:#6b7280}
    nav a:hover{color:#111214}
    .eyebrow{font-family:"Geist Mono",ui-monospace,monospace;font-size:.75rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#6b7280}
    h1{font-size:2.25rem;line-height:1.1;letter-spacing:-.025em;font-weight:600;margin:1rem 0 2rem}
    .post{display:block;padding:1.4rem 0;border-top:1px solid #e8e8e8}
    .post:last-child{border-bottom:1px solid #e8e8e8}
    .post:hover .post-title{text-decoration:underline;text-underline-offset:3px}
    .post-title{font-weight:600;font-size:1.3rem;letter-spacing:-.015em;line-height:1.25}
    .post-meta{font-family:"Geist Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:#9ca3af;margin-top:.4rem}
    .post-excerpt{font-size:.95rem;line-height:1.55;color:#4b5563;margin-top:.5rem}
    .post .arrow{float:right;color:#9ca3af;font-size:1.1rem}
    .empty{font-size:.875rem;color:#6b7280}
    footer{margin-top:3.5rem;padding-top:1.25rem;border-top:1px solid #e8e8e8}
    footer p{font-size:.8rem;color:#6b7280}
    footer a{text-decoration:underline;text-underline-offset:3px}
    footer a:hover{color:#111214}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="brand" aria-label="Inicio"><svg class="isotipo" viewBox="100 125 176 176" width="26" height="26" aria-hidden="true"><g transform="translate(0.000000,400.000000) scale(0.100000,-0.100000)" stroke="none"><path d="M1177 2570 c58 -73 129 -164 203 -258 l55 -71 400 -3 400 -3 3 -197 2 -198 195 0 195 0 0 395 0 395 -751 0 -750 0 48 -60z"/><path d="M1771 1823 c8 -10 21 -27 31 -38 9 -11 57 -72 107 -135 50 -63 121 -152 158 -197 l67 -83 239 0 239 0 -33 43 c-18 23 -45 56 -59 73 -14 17 -37 47 -52 65 -15 19 -59 75 -99 124 -40 50 -86 107 -104 128 l-32 37 -238 0 c-223 0 -237 -1 -224 -17z"/></g></svg></a>
      <nav aria-label="Navegación">
        <a href="/blog/">Blog</a>
        <a href="https://www.tiendly.lat" target="_blank" rel="noopener noreferrer">Tiendly</a>
      </nav>
    </header>
    <main>
      <p class="eyebrow">Blog</p>
      <h1>Escritos</h1>
      <div id="posts"><p class="empty">Cargando…</p></div>
    </main>
    <footer>
      <p>© Ray, Software Engineer — <a href="/about/">conoce más de mí</a></p>
    </footer>
  </div>
  <script>
    fetch('/blog/posts.json')
      .then(r => r.json())
      .then(data => {
        const el = document.getElementById('posts');
        if (!data.posts.length) { el.innerHTML = '<p class="empty">Sin posts todavía.</p>'; return; }
        const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/\./g, '');
        el.innerHTML = data.posts.map(p => `
          <a class="post" href="/blog/${p.slug}/">
            <span class="arrow">↗</span>
            <div class="post-title">${p.title}</div>
            <div class="post-meta">${fmt(p.date)}</div>
            ${p.excerpt ? `<div class="post-excerpt">${p.excerpt}</div>` : ''}
          </a>`).join('');
      })
      .catch(() => { document.getElementById('posts').innerHTML = '<p class="empty">No se pudo cargar.</p>'; });
  </script>
</body>
</html>
