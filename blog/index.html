<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Ray</title>
  <meta name="description" content="Blog de Ray." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="canonical" href="https://www.rblez.com/blog/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#fff;color:#111;font-family:"Source Serif 4",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .container{max-width:36rem;margin:0 auto;padding:3rem 2rem}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3rem}
    .isotipo{width:22px;height:22px;display:block}
    .isotipo g{fill:#111}
    .brand{display:flex;align-items:center;gap:.6rem}
    .name{font-size:1.125rem;font-weight:700}
    .name a:hover{color:#555}
    nav{display:flex;gap:1.5rem}
    nav a{font-size:.75rem;color:#6b7280}
    nav a:hover{color:#111}
    h2{font-size:1.125rem;font-weight:700;margin-bottom:1.5rem}
    .post{display:block;padding:1rem 0;border-top:1px solid #eee}
    .post:last-child{border-bottom:1px solid #eee}
    .post:hover .post-title{text-decoration:underline;text-underline-offset:3px}
    .post-title{font-weight:500;font-size:.95rem}
    .post-meta{font-size:.75rem;color:#6b7280;margin-top:.25rem}
    .post-excerpt{font-size:.85rem;color:#555;margin-top:.35rem}
    .empty{font-size:.875rem;color:#6b7280}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="brand" aria-label="Inicio"><svg class="isotipo" viewBox="100 125 176 176" width="22" height="22" aria-hidden="true"><g transform="translate(0.000000,400.000000) scale(0.100000,-0.100000)" stroke="none"><path d="M1177 2570 c58 -73 129 -164 203 -258 l55 -71 400 -3 400 -3 3 -197 2 -198 195 0 195 0 0 395 0 395 -751 0 -750 0 48 -60z"/><path d="M1771 1823 c8 -10 21 -27 31 -38 9 -11 57 -72 107 -135 50 -63 121 -152 158 -197 l67 -83 239 0 239 0 -33 43 c-18 23 -45 56 -59 73 -14 17 -37 47 -52 65 -15 19 -59 75 -99 124 -40 50 -86 107 -104 128 l-32 37 -238 0 c-223 0 -237 -1 -224 -17z"/></g></svg></a>
      <nav>
        <a href="https://www.tiendly.lat" target="_blank" rel="noopener">Tiendly</a>
      </nav>
    </header>
    <main>
      <h2>Blog</h2>
      <div id="posts"><p class="empty">Cargando…</p></div>
    </main>
  </div>
  <script>
    fetch('/blog/posts.json')
      .then(r => r.json())
      .then(data => {
        const el = document.getElementById('posts');
        if (!data.posts.length) { el.innerHTML = '<p class="empty">Sin posts todavía.</p>'; return; }
        el.innerHTML = data.posts.map(p => `
          <a class="post" href="/blog/p.html?slug=${p.slug}">
            <div class="post-title">${p.title}</div>
            <div class="post-meta">${p.date}</div>
            ${p.excerpt ? `<div class="post-excerpt">${p.excerpt}</div>` : ''}
          </a>`).join('');
      })
      .catch(() => { document.getElementById('posts').innerHTML = '<p class="empty">No se pudo cargar.</p>'; });
  </script>
</body>
</html>
