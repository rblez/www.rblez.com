<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ray</title>

  <meta
    name="description"
    content="Ray, fundador y CEO de Tiendly. Construyo productos que resuelven problemas reales."
  />

  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />

  <link rel="canonical" href="https://www.rblez.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.rblez.com/" />
  <meta property="og:title" content="Ray — Fundador y CEO de Tiendly" />
  <meta
    property="og:description"
    content="Construyo productos que resuelven problemas reales."
  />
  <meta property="og:image" content="https://www.rblez.com/og-image.svg" />
  <meta property="og:site_name" content="Ray" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ray — Fundador y CEO de Tiendly" />
  <meta
    name="twitter:description"
    content="Construyo productos que resuelven problemas reales."
  />
  <meta name="twitter:image" content="https://www.rblez.com/og-image.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
    rel="stylesheet"
  />
  <!-- Material Design Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
    rel="stylesheet"
  />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon-black.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/favicon-white.svg" media="(prefers-color-scheme: dark)" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      background: #fff;
      color: #111;
      font-family:
        "Source Serif 4",
        Georgia,
        "Times New Roman",
        serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      background: #111;
      color: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 36rem;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    /* Header */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .isotipo {
      width: 22px;
      height: 22px;
      display: block;
    }

    .isotipo g {
      fill: #111;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      font-size: 0.75rem;
      color: #6b7280;
    }

    nav a:hover {
      color: #111;
    }

    /* Main */

    main > * + * {
      margin-top: 2rem;
    }

    .bio {
      font-size: 0.875rem;
      line-height: 1.7;
      color: #111;
    }

    .bio a {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .bio a:hover {
      color: #555;
    }

    /* Links */

    .links {
      padding-top: 1rem;
      display: flex;
      gap: 1.25rem;
    }

    .links a {
      color: #6b7280;
      font-size: 1.25rem;
      line-height: 1;
      transition: color 0.15s;
    }

    .links a:hover {
      color: #111;
    }

    .links a:hover .si-icon {
      filter: brightness(0.2);
    }

    .si-icon {
      display: block;
      width: 17px;
      height: 17px;
      transition: filter 0.15s;
    }

    .mdi {
      font-size: 20px;
      line-height: 1;
    }


    /* Footer */

    footer {
      margin-top: 5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
    }

    footer p {
      font-size: 0.75rem;
      color: #6b7280;
    }

    footer a {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    footer a:hover {
      color: #111;
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <a href="/" class="brand" aria-label="Inicio">
        <svg
          class="isotipo"
          viewBox="100 125 176 176"
          width="22"
          height="22"
          aria-hidden="true"
        >
          <g transform="translate(0.000000,400.000000) scale(0.100000,-0.100000)" stroke="none">
            <path d="M1177 2570 c58 -73 129 -164 203 -258 l55 -71 400 -3 400 -3 3 -197
2 -198 195 0 195 0 0 395 0 395 -751 0 -750 0 48 -60z"/>
            <path d="M1771 1823 c8 -10 21 -27 31 -38 9 -11 57 -72 107 -135 50 -63 121
-152 158 -197 l67 -83 239 0 239 0 -33 43 c-18 23 -45 56 -59 73 -14 17 -37
47 -52 65 -15 19 -59 75 -99 124 -40 50 -86 107 -104 128 l-32 37 -238 0
c-223 0 -237 -1 -224 -17z"/>
          </g>
        </svg>
      </a>
      <nav aria-label="Navegación">
        <a href="/blog/">Blog</a>
        <a href="https://www.tiendly.lat" target="_blank" rel="noopener noreferrer">Tiendly</a>
      </nav>
    </header>

    <main>
      <p class="bio">
        Fundador y CEO de <a href="https://www.tiendly.lat" target="_blank" rel="noopener noreferrer">Tiendly</a>.
        Construyo productos que resuelven problemas reales: software simple,
        útil y que realmente pueda utilizarse.
      </p>

      <section class="links" aria-label="Redes sociales">
        <a href="https://github.com/rblez" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <img src="https://cdn.simpleicons.org/github/6b7280" alt="" width="17" height="17" class="si-icon" />
        </a>
        <a href="https://t.me/rblez" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
          <img src="https://cdn.simpleicons.org/telegram/6b7280" alt="" width="17" height="17" class="si-icon" />
        </a>
        <a href="https://x.com/rblez_" target="_blank" rel="noopener noreferrer" aria-label="X">
          <img src="https://cdn.simpleicons.org/x/6b7280" alt="" width="17" height="17" class="si-icon" />
        </a>
        <a href="mailto:hello@rblez.com" aria-label="Email">
          <span class="mdi mdi-email"></span>
        </a>
      </section>
    </main>

    <footer>
      <p>© Ray, Software Engineer — <a href="/about/">conoce más de mí</a></p>
    </footer>

  </div>
</body>
</html>
