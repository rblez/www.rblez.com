<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ray</title>

  <meta
    name="description"
    content="Ray, fundador y CEO de Tiendly. Construyo productos que resuelven problemas reales."
  />

  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />

  <link rel="canonical" href="https://www.rblez.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.rblez.com/" />
  <meta property="og:title" content="Ray — Fundador y CEO de Tiendly" />
  <meta
    property="og:description"
    content="Construyo productos que resuelven problemas reales."
  />
  <meta property="og:image" content="https://www.rblez.com/og-image.svg" />
  <meta property="og:site_name" content="Ray" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ray — Fundador y CEO de Tiendly" />
  <meta
    name="twitter:description"
    content="Construyo productos que resuelven problemas reales."
  />
  <meta name="twitter:image" content="https://www.rblez.com/og-image.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon-black.svg" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      background: #fff;
      color: #111;
      font-family:
        "Inter",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      background: #111;
      color: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 36rem;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    /* Header */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
    }

    .name {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .name a:hover {
      color: #555;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      font-size: 0.75rem;
      color: #6b7280;
    }

    nav a:hover {
      color: #111;
    }

    /* Main */

    main > * + * {
      margin-top: 2rem;
    }

    .bio {
      font-size: 0.875rem;
      line-height: 1.7;
      color: #111;
    }

    .bio a {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .bio a:hover {
      color: #555;
    }

    /* Links */

    .links {
      padding-top: 1rem;
    }

    .links p + p {
      margin-top: 0.15rem;
    }

    .links a {
      font-size: 0.75rem;
      color: #6b7280;
    }

    .links a:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
      color: #111;
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1 class="name"><a href="/">Ray</a></h1>
      <nav aria-label="Navegación">
        <a href="https://www.tiendly.lat" target="_blank" rel="noopener noreferrer">Tiendly</a>
        <a href="https://t.me/rayomarblez" target="_blank" rel="noopener noreferrer">Blog de Telegram</a>
      </nav>
    </header>

    <main>
      <p class="bio">
        Fundador y CEO de <a href="https://www.tiendly.lat" target="_blank" rel="noopener noreferrer">Tiendly</a>.
        Construyo productos que resuelven problemas reales: software simple,
        útil y que realmente pueda utilizarse.
      </p>

      <section class="links" aria-label="Enlaces">
        <p><a href="https://github.com/rblez" target="_blank" rel="noopener noreferrer">GitHub</a></p>
        <p><a href="https://t.me/rblez" target="_blank" rel="noopener noreferrer">Telegram</a></p>
        <p><a href="https://x.com/rblez_" target="_blank" rel="noopener noreferrer">X</a></p>
        <p><a href="mailto:hello@rblez.com">Email</a></p>
      </section>
    </main>

  </div>
</body>
</html>
