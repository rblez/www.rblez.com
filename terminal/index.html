<!DOCTYPE html>
<html lang="en">

<head>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    :root {
      --app-h: 100vh;
      --fs: 13px;
    }
    @supports (height: 100dvh) {
      :root { --app-h: 100dvh; }
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background: #000 url('./wallpaper.webp') center/cover no-repeat fixed;
      font-family: 'Geist Mono', 'SF Mono', ui-monospace, Menlo, monospace;
      height: var(--app-h);
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* ── Window ── */
    .win {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #333;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      width: 860px;
      height: 560px;
      max-width: 96vw;
      max-height: 92vh;
    }

    /* Large desktop: same scaled-up window as before */
    @media (min-width: 1200px) and (min-height: 760px) {
      .win {
        max-width: none;
        max-height: none;
        transform: scale(1.25);
        transform-origin: center center;
      }
    }

    /* ── Title bar ── */
    .tb {
      background: #111;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
      height: 40px;
    }

    .dots { display: flex; gap: 7px; }

    .d {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      transition: opacity 0.2s;
    }

    .r { background: #ff5f57; cursor: pointer; }
    .y { background: #666; cursor: not-allowed; opacity: 0.6; }
    .g { background: #666; cursor: not-allowed; opacity: 0.6; }
    .r:hover { opacity: 0.8; }

    .ttl {
      flex: 1;
      text-align: center;
      color: #555;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      /* keep the title optically centred against the dots */
      margin-right: 50px;
    }

    /* ── Terminal body ── */
    .term {
      padding: 14px 16px;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      cursor: text;
      display: flex;
      flex-direction: column;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .term::-webkit-scrollbar { width: 3px; }
    .term::-webkit-scrollbar-track { background: #000; }
    .term::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .term { scrollbar-width: thin; scrollbar-color: #333 #000; }

    /* pushes content to bottom on first load */
    .spacer { flex: 1; }

    /* ── Lines ── */
    .line {
      font-size: var(--fs);
      line-height: 1.65;
      color: #ededed;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      margin-bottom: 8px;
      max-width: 100%;
    }

    /* ── Active prompt row ── */
    .prompt-row {
      position: relative;
      display: flex;
      align-items: flex-start;
      font-size: var(--fs);
      line-height: 1.65;
      flex-wrap: nowrap;
      flex-shrink: 0;
      max-width: 100%;
    }

    .pr {
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      color: #28c840;
    }

    .typed {
      color: #ffffff;
      flex: 1;
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      padding-right: 4px;
      padding-left: 6px;
    }

    .cur {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: #fff;
      margin-left: 4px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Real input laid over the prompt row. Invisible, but in the viewport
       so a tap opens the mobile keyboard; 16px avoids iOS zoom-on-focus. */
    #inp {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 16px;
      font-family: inherit;
      padding: 0;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      cursor: text;
    }

    body > #inp { inset: auto; left: 0; top: 0; width: 1px; height: 1px; }

    /* ── Colours ── */
    .k   { color: #888; }
    .grn { color: #28c840; }
    .err { color: #ff5f57; }
    .w   { color: #fff; font-weight: 700; }
    .nw  { white-space: nowrap; display: inline-block; }
    .proj { margin-top: 2px; }
    .desc { padding-left: 2ch; }

    a {
      color: #ededed;
      border-bottom: 1px solid #444;
      text-decoration: none;
    }
    a:hover { border-bottom-color: #ededed; }

    .welcome { color: #28c840; }

    /* typing animation */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: #28c840;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }

    .fade-in { animation: fadeIn 0.3s ease-in; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Command chips (touch / small screens) ── */
    .chips {
      display: none;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #222;
      background: #0a0a0a;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .chip {
      flex: 1 1 auto;
      font-family: inherit;
      font-size: 13px;
      line-height: 1;
      color: #28c840;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      padding: 10px 14px;
      min-height: 36px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .chip:active { background: #1c1c1c; border-color: #28c840; }
    .chip:focus-visible { outline: 1px solid #28c840; outline-offset: 2px; }

    /* Tablet */
    @media (max-width: 900px) {
      body {
        padding:
          max(12px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
      }
      .win {
        width: 100%;
        max-width: 760px;
        height: min(100%, 820px);
        max-height: none;
      }
      .chips { display: flex; }
    }

    /* Phone */
    @media (max-width: 600px) {
      :root { --fs: clamp(12px, 3.4vw, 13px); }
      body {
        padding:
          max(8px, env(safe-area-inset-top))
          max(8px, env(safe-area-inset-right))
          max(8px, env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
      }
      .win { height: 100%; border-radius: 10px; }
      .tb  { padding: 8px 12px; }
      .ttl { margin-right: 44px; }
      .term { padding: 10px 12px; }
      .line { margin-bottom: 6px; }
      .cur { width: 7px; }
      .chips { padding: 8px 10px; gap: 6px; }
      .chip { font-size: 12.5px; padding: 10px 8px; }
    }
    @media (max-width: 380px) {
      .chips { gap: 5px; padding: 8px; }
      .chip { font-size: 12px; padding: 10px 5px; }
    }

    /* Any touch device (e.g. large tablets) gets the chips too */
    @media (pointer: coarse) {
      .chips { display: flex; }
    }

    /* Landscape phone */
    @media (max-height: 500px) and (orientation: landscape) {
      body { padding: max(4px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
      .win { width: 100%; max-width: none; height: 100%; transform: none; }
      .tb   { padding: 5px 12px; height: 30px; }
      .term { padding: 6px 12px; }
      .chips { padding: 6px 10px; }
      .chip { padding: 7px 12px; min-height: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="win" id="win">
    <div class="tb">
      <div class="dots">
        <div class="d r" id="close-btn" title="close"></div>
        <div class="d y"></div>
        <div class="d g"></div>
      </div>
      <div class="ttl">rblez@web — Terminal</div>
    </div>
    <div class="term" id="term">
      <div class="spacer"></div>
      <div class="line welcome" id="welcome"></div>
      <!-- active prompt inserted by JS -->
    </div>
    <nav class="chips" id="chips" aria-label="Quick commands">
      <button class="chip" type="button" data-cmd="help">help</button>
      <button class="chip" type="button" data-cmd="about">about</button>
      <button class="chip" type="button" data-cmd="projects">projects</button>
      <button class="chip" type="button" data-cmd="skills">skills</button>
      <button class="chip" type="button" data-cmd="contact">contact</button>
    </nav>
  </div>

  <input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
         spellcheck="false" inputmode="text" enterkeyhint="go" aria-label="terminal input" />

  <script>
    const term  = document.getElementById('term');
    const inp   = document.getElementById('inp');
    const PROMPT_HTML = 'rblez@web &gt;';
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const finePointer  = window.matchMedia('(pointer: fine)').matches;

    let cmdHistory = [], hIdx = -1, currentVal = '';

    const LINKS = {
      tiendly:    'https://www.tiendly.lat',
      pickea:     'https://www.tiendly.lat/pickea',
      roldos:     'https://roldos.vercel.app',
      explorador: 'https://www.rblez.com/explorador/',
      asciidot:   'https://www.rblez.com/asciidot/',
      github:     'https://github.com/rblez',
      x:          'https://x.com/rblez_',
      instagram:  'https://instagram.com/rayomarblez',
      telegram:   'https://t.me/rblez',
      mail:       'mailto:hello@rblez.com'
    };

    const SKILLS = ['TypeScript', 'Svelte', 'Tailwind', 'Bun', 'Supabase', 'PostgreSQL',
                    'Cloudflare', 'Vercel', 'Resend', 'Telegram', 'Git', 'GitHub'];

    const PROJECTS = [
      ['tiendly',    'www.tiendly.lat',             'SaaS to create online stores, 0% commission'],
      ['pickea',     'www.tiendly.lat/pickea',      'digital store for assisted shopping'],
      ['roldos',     'roldos.vercel.app',           'café website with menu, cart and orders'],
      ['explorador', 'www.rblez.com/explorador',    'Cuban bank card explorer built on the QvaPay catalog'],
      ['asciidot',   'www.rblez.com/asciidot',      'turns images into braille ASCII art']
    ];

    const a = (href, label) =>
      `<a href="${href}"${href.startsWith('mailto:') ? '' : ' target="_blank" rel="noopener"'}>${label}</a>`;

    /* ── Commands ── */
    const COMMANDS = {
      help: () =>
`<span class="grn">commands:</span>
  <span class="k">whoami</span>     who I am
  <span class="k">about</span>      about me
  <span class="k">skills</span>     tech stack
  <span class="k">projects</span>   what I've built
  <span class="k">contact</span>    find me online
  <span class="k">open</span>       open a project or profile
  <span class="k">now</span>        what I'm doing now
  <span class="k">pwd</span>        show current directory
  <span class="k">clear</span>      clear terminal
  <span class="k">help</span>       show this`,

      whoami: () =>
`<span class="k">user      </span>rblez
<span class="k">role      </span><span class="w">Software Engineer &amp; Builder</span>
<span class="k">location  </span>Santiago de Cuba, Cuba
<span class="k">os        </span>Linux · Windows
<span class="k">status    </span><span class="w">self-taught</span> · dropped university to build
<span class="k">interests </span>pixel art · software engineering`,

      about: () =>
`<span class="w">rblez</span> — Software Engineer &amp; Builder
<span class="k">Santiago de Cuba, Cuba</span>

Software engineer and pixel art lover building real products for real people. Started reselling gift cards and game top-ups, now building digital infrastructure for Cuban businesses.
I don't wait for the right conditions — I build with what I have.`,

      skills: () =>
`<span class="grn">stack:</span>
${SKILLS.map(s => `<span class="nw"><span class="k">·</span> ${s}</span>`).join('  ')}`,

      contact: () =>
`<span class="k">email     </span>${a(LINKS.mail, 'hello@rblez.com')}
<span class="k">x         </span>${a(LINKS.x, '@rblez_')}
<span class="k">instagram </span>${a(LINKS.instagram, '@rayomarblez')}
<span class="k">telegram  </span>${a(LINKS.telegram, '@rblez')}
<span class="k">github    </span>${a(LINKS.github, 'rblez')}`,

      open: (args) => {
        const t = (args[0] || '').toLowerCase();
        const list = `<span class="k">targets: ${Object.keys(LINKS).join(' · ')}</span>`;
        if (!t)        return `<span class="err">usage: open &lt;target&gt;</span>\n${list}`;
        if (!LINKS[t]) return `<span class="err">open: unknown "${esc(t)}"</span>\n${list}`;
        if (t === 'mail') window.location.href = LINKS[t];
        else window.open(LINKS[t], '_blank', 'noopener');
        return `opening ${t}...`;
      },

      pwd: () => `<span class="k">/home/rblez/projects</span>`,

      projects: () =>
`<span class="grn">projects:</span>` +
PROJECTS.map(([n, url, d]) => `<div class="proj"><span class="w">${n}</span>  ${a('https://' + url + (url.includes('rblez.com/') ? '/' : ''), url)}<div class="desc k">${d}</div></div>`).join(''),

      now: () => {
        const now = new Date();
        return `<span class="k">current time:</span> ${now.toLocaleString('en-US', {
          weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        })}
<span class="k">building:</span> Tiendly
<span class="k">experimenting:</span> products, automations and AI`;
      },

      sudo: () => {
        const messages = [
          `<span class="err">sudo: permission denied</span>`,
          `<span class="err">sudo: you are not in the sudoers file</span>`,
          `<span class="err">sudo: this incident will be reported</span>`
        ];
        return messages[Math.floor(Math.random() * messages.length)];
      },

      hack: () => {
        const steps = [
          `<span class="grn">Accessing mainframe...</span>`,
          `<span class="grn">Bypassing firewall...</span>`,
          `<span class="grn">Extracting data...</span>`,
          `<span class="err">Just kidding! I'm a good hacker.</span>`
        ];
        steps.forEach((line, i) => {
          setTimeout(() => addOutput(line), (i + 1) * (reduceMotion ? 50 : 500));
        });
        return `<span class="grn">Initializing hack sequence...</span>`;
      },

      matrix: () => {
        const cols = term.clientWidth < 480 ? 28 : 60;
        let result = '<span style="color:#0f0">';
        for (let i = 0; i < 8; i++) {
          for (let j = 0; j < cols; j++) result += Math.random() < 0.5 ? '0' : '1';
          result += '\n';
        }
        return result + '</span><span class="grn">Wake up, Neo...</span>';
      },

      clear: () => {
        clearTerminal();
        return null;
      }
    };

    const COMPLETIONS = [...Object.keys(COMMANDS), ...Object.keys(LINKS)];

    /* ── Helpers ── */
    function esc(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let welcomeTimer = null;
    function typeWelcome() {
      const welcome = document.getElementById('welcome');
      const text = "Welcome to rblez terminal. Type 'help' or tap a command below.";
      const desktopText = "Welcome to rblez terminal. Type 'help' for available commands.";
      const msg = getComputedStyle(document.getElementById('chips')).display === 'none' ? desktopText : text;
      clearTimeout(welcomeTimer);
      if (reduceMotion) { welcome.textContent = msg; return; }
      let index = 0;
      (function typeChar() {
        if (index < msg.length) {
          welcome.innerHTML = esc(msg.substring(0, index + 1)) + '<span class="typing-cursor"></span>';
          index++;
          welcomeTimer = setTimeout(typeChar, 40);
        } else {
          welcome.textContent = msg;
        }
      })();
    }

    function scrollBottom() {
      requestAnimationFrame(() => { term.scrollTop = term.scrollHeight; });
    }

    /* ── DOM builders ── */
    function buildPromptRow() {
      const row = document.createElement('div');
      row.className = 'prompt-row';
      row.id = 'active-line';

      const pr = document.createElement('span');
      pr.className = 'pr';
      pr.innerHTML = PROMPT_HTML;

      const typed = document.createElement('span');
      typed.className = 'typed';
      typed.id = 'typed-text';

      const cur = document.createElement('span');
      cur.className = 'cur';
      typed.appendChild(cur);

      row.appendChild(pr);
      row.appendChild(typed);
      return row;
    }

    function newPrompt() {
      const hadFocus = document.activeElement === inp;
      const old = document.getElementById('active-line');
      if (old) old.remove();

      currentVal = '';
      inp.value = '';
      const row = buildPromptRow();
      row.appendChild(inp);            // the real input lives on the active line
      term.appendChild(row);
      if (hadFocus) inp.focus({ preventScroll: true });
      scrollBottom();
    }

    function updateDisplay() {
      const tt = document.getElementById('typed-text');
      if (!tt) return;
      tt.textContent = currentVal;
      const cur = document.createElement('span');
      cur.className = 'cur';
      tt.appendChild(cur);
    }

    function setValue(v) {
      currentVal = v;
      inp.value = v;
      try { inp.setSelectionRange(v.length, v.length); } catch (_) {}
      updateDisplay();
    }

    function freezePrompt(val) {
      const al = document.getElementById('active-line');
      if (!al) return;
      const frozen = document.createElement('div');
      frozen.className = 'line';
      const pr = document.createElement('span');
      pr.className = 'pr';
      pr.innerHTML = PROMPT_HTML;
      frozen.appendChild(pr);
      frozen.appendChild(document.createTextNode(' ' + val));
      document.body.appendChild(inp);  // park the input while the row is swapped
      al.replaceWith(frozen);
    }

    function addOutput(html) {
      const al = document.getElementById('active-line');
      const d  = document.createElement('div');
      d.className = 'line fade-in';
      d.innerHTML = html;
      if (al) term.insertBefore(d, al);
      else term.appendChild(d);
      scrollBottom();
    }

    function clearTerminal() {
      document.body.appendChild(inp);
      while (term.firstChild) term.removeChild(term.firstChild);
      const spacer = document.createElement('div');
      spacer.className = 'spacer';
      const welcome = document.createElement('div');
      welcome.className = 'line welcome';
      welcome.id = 'welcome';
      term.appendChild(spacer);
      term.appendChild(welcome);
      newPrompt();
      typeWelcome();
    }

    /* ── Command runner ── */
    function run(val) {
      const trimmed = val.trim();
      const hadFocus = document.activeElement === inp;
      freezePrompt(trimmed);
      currentVal = '';

      if (!trimmed) { newPrompt(); if (hadFocus) inp.focus({ preventScroll: true }); return; }

      cmdHistory.unshift(trimmed);
      hIdx = -1;

      const [cmd, ...args] = trimmed.split(/\s+/);
      const fn = COMMANDS[cmd.toLowerCase()];

      if (!fn) {
        addOutput(`<span class="err">command not found: ${esc(cmd)}</span>\n<span class="k">type 'help' for available commands</span>`);
      } else {
        const result = fn(args);
        if (result === null) return;   // clear already rebuilt the prompt
        if (result !== undefined) addOutput(result);
      }
      newPrompt();
      if (hadFocus) inp.focus({ preventScroll: true });
    }

    /* ── Input handling ── */
    inp.addEventListener('input', () => {
      currentVal = inp.value;
      updateDisplay();
      scrollBottom();
    });

    inp.addEventListener('keydown', e => {
      if (e.isComposing) return;
      switch (e.key) {
        case 'Enter':
          e.preventDefault();
          run(inp.value);
          break;
        case 'ArrowUp':
          e.preventDefault();
          if (hIdx < cmdHistory.length - 1) setValue(cmdHistory[++hIdx]);
          break;
        case 'ArrowDown':
          e.preventDefault();
          if (hIdx > 0) setValue(cmdHistory[--hIdx]);
          else { hIdx = -1; setValue(''); }
          break;
        case 'ArrowLeft':
        case 'ArrowRight':
        case 'Home':
        case 'End':
          e.preventDefault();          // cursor is always drawn at the end
          break;
        case 'Tab': {
          e.preventDefault();
          const v = inp.value.toLowerCase();
          const parts = v.split(' ');
          const last = parts[parts.length - 1];
          const m = COMPLETIONS.find(c => c.startsWith(last) && c !== last);
          if (m) { parts[parts.length - 1] = m; setValue(parts.join(' ')); }
          break;
        }
        default:
          if (e.ctrlKey && e.key === 'c') {
            e.preventDefault();
            addOutput('<span class="err">^C</span>');
            newPrompt();
            inp.focus({ preventScroll: true });
          } else if (e.ctrlKey && e.key === 'l') {
            e.preventDefault();
            clearTerminal();
            inp.focus({ preventScroll: true });
          }
      }
    });

    /* Focus management: a tap/click on the terminal focuses the real input,
       which opens the keyboard on phones. Links and text selection still work. */
    term.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      const sel = window.getSelection();
      if (sel && sel.toString()) return;
      inp.focus({ preventScroll: true });
      scrollBottom();
    });

    document.addEventListener('keydown', e => {
      if (document.activeElement !== inp && !e.metaKey && !e.altKey &&
          !(e.target && e.target.closest && e.target.closest('.chip'))) {
        inp.focus({ preventScroll: true });
      }
    });

    /* Command chips */
    document.getElementById('chips').addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      setValue(btn.dataset.cmd);
      run(btn.dataset.cmd);
    });

    /* Keep the window inside the visible area when the mobile keyboard opens */
    if (window.visualViewport) {
      const vv = window.visualViewport;
      const fit = () => {
        document.documentElement.style.setProperty('--app-h', vv.height + 'px');
        window.scrollTo(0, 0);
        scrollBottom();
      };
      vv.addEventListener('resize', fit);
    }

    /* ── Init ── */
    window.addEventListener('load', () => {
      newPrompt();
      if (finePointer) inp.focus({ preventScroll: true });
      scrollBottom();
      typeWelcome();
    });

    /* Close button */
    document.getElementById('close-btn').addEventListener('click', () => {
      const win = document.getElementById('win');
      win.style.transition = 'opacity 0.3s, transform 0.3s';
      win.style.opacity = '0';
      win.style.transform = 'scale(0.92)';
      setTimeout(() => { window.close(); window.location.href = 'about:blank'; }, reduceMotion ? 0 : 300);
    });

    if (finePointer) {
      document.addEventListener('contextmenu', e => {
        if (!e.target.closest('a')) e.preventDefault();
      });
    }
  </script>
</body>

</html>
